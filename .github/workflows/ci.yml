name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  # never cancel main: every main commit needs its image so it can be released
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    permissions:
      contents: read
      pull-requests: write
    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit

  docker:
    needs: build-and-test
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/docker.yml
    secrets: inherit
