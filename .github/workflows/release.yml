name: Release

# Promotes the image already built and tested on main to the release tags.
# Nothing is rebuilt; if CI was not green for the tagged commit, no tags move.

on:
  release:
    types: [published]

env:
  IMAGE_NAME: ryanpage/lettarrboxd

jobs:
  promote:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Validate tag is semver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "MAJOR=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "MINOR=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from main"
            exit 1
          fi

      - name: Verify CI passed for the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          COUNT=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
            --branch main --event push --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq 'length')
          if [ "$COUNT" -lt 1 ]; then
            echo "::error::No successful CI run on main for $GITHUB_SHA. Wait for CI or merge a fix, then re-run this workflow."
            exit 1
          fi

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag tested image
        run: |
          TAG="${{ github.event.release.tag_name }}"
          SRC="${IMAGE_NAME}:main-${GITHUB_SHA::7}"
          TAGS=(-t "${IMAGE_NAME}:${TAG}")
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            TAGS+=(-t "${IMAGE_NAME}:v${MAJOR}.${MINOR}" -t "${IMAGE_NAME}:v${MAJOR}" -t "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
