name: Release

# Promotes the image already built and tested on main to the release tags.
# Nothing is rebuilt; if CI was not green for the tagged commit, no tags move.

on:
  release:
    types: [published]

env:
  IMAGE_NAME: ghcr.io/ryanpag3/lettarrboxd

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - name: Validate tag is semver
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ ! "$TAG" =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            echo "::error::Release tag '$TAG' is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          echo "MAJOR=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"
          echo "MINOR=${BASH_REMATCH[2]}" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Verify tagged commit is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tagged commit $GITHUB_SHA is not reachable from main"
            exit 1
          fi

      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Poll the push-to-main CI run for this commit (build, test and image push).
          for i in $(seq 1 60); do
            RUN=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml \
              --branch main --event push --commit "$GITHUB_SHA" \
              --json status,conclusion,url --jq '.[0] // empty')
            if [ -z "$RUN" ]; then
              echo "No CI run found yet for $GITHUB_SHA (attempt $i)"
            else
              STATUS=$(echo "$RUN" | jq -r .status)
              CONCLUSION=$(echo "$RUN" | jq -r .conclusion)
              echo "CI run: $STATUS/$CONCLUSION $(echo "$RUN" | jq -r .url)"
              if [ "$STATUS" = "completed" ]; then
                if [ "$CONCLUSION" = "success" ]; then exit 0; fi
                echo "::error::CI for $GITHUB_SHA finished with '$CONCLUSION'. Fix it and publish a new release."
                exit 1
              fi
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Retag tested image
        run: |
          TAG="${{ github.event.release.tag_name }}"
          SRC="${IMAGE_NAME}:main-${GITHUB_SHA::7}"
          TAGS=(-t "${IMAGE_NAME}:${TAG}")
          if [ "${{ github.event.release.prerelease }}" != "true" ]; then
            TAGS+=(-t "${IMAGE_NAME}:v${MAJOR}.${MINOR}" -t "${IMAGE_NAME}:v${MAJOR}" -t "${IMAGE_NAME}:latest")
          fi
          docker buildx imagetools create "${TAGS[@]}" "$SRC"
          docker buildx imagetools inspect "${IMAGE_NAME}:${TAG}"
